name: PR Validation

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: Build, test, start core containers, and validate login contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, run tests, and enforce JaCoCo coverage on both modules
        run: mvn -B -ntp clean verify

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports-pr-${{ github.event.pull_request.number }}
          if-no-files-found: warn
          path: |
            quickstock-core-service/target/site/jacoco/
            payments-service/target/site/jacoco/

#      - name: Set up Docker Buildx
#        uses: docker/setup-buildx-action@v4

      - name: Start core application containers
        run: docker compose up -d --build core-db quickstock-core-service

      - name: Wait for login endpoint and verify updated auth contract
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_URL="http://localhost:8081/auth/login"
          PAYLOAD='{"email":"admin@quickstock.local","password":"admin"}'

          echo "Waiting for application to become ready..."

          for i in {1..30}; do
            http_code=$(curl -sS -m 10 -o response.json -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$LOGIN_URL" || true)

            if [ "$http_code" = "200" ]; then
              python -c "import json, pathlib; payload = json.loads(pathlib.Path('response.json').read_text()); assert 'accessToken' in payload, 'Response does not contain accessToken'; assert payload['accessToken'], 'accessToken is empty'; assert 'token' not in payload, 'Legacy token field still present'"
              echo "Login contract check passed. Response contains accessToken."
              exit 0
            fi

            echo "Attempt $i/30: endpoint not ready yet (HTTP $http_code)"
            sleep 10
          done

          echo "Login contract check failed. Response did not contain accessToken."
          echo "Last response:"
          cat response.json || true
          echo
          echo "Container status:"
          docker compose ps
          echo
          echo "Container logs:"
          docker compose logs --no-color
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v
